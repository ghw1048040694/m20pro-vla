[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m20pro-vla"
version = "0.1.0"
description = "Public M20 Pro MuJoCo VLA simulation core"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3,<3.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
vla = ["torch>=2.7", "pillow>=10", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
m20pro-vla = "m20pro_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["m20pro_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
