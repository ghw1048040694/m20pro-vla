schema: m20pro_mujoco_vla_contract_v1
simulation:
  primary: mujoco_3_3_7_wsl
  sim2sim_validation: windows_isaac_sim_6_0_1_rc7
  windows_isaac_sim_used_for_primary_training: false

policy_input:
  required:
    - front_rgb
    - rear_rgb
    - planar_lidar_72
    - qpos_qvel
    - language_instruction
  prohibited:
    - target_world_position
    - target_geometry_id
    - simulator_object_pose
    - semantic_mask

action_interface:
  high_level: learned_forward_lateral_yaw_stop_action_chunk
  low_level: learned_m20_locomotion_policy
  direct_open_loop_joint_trajectory: prohibited
  privileged_target_pose_controller: prohibited

data:
  train_scenes_randomized: true
  multi_object_per_scene: true
  counterfactual_instruction_swap_required: true
  holdout_layouts_disjoint: true
  obstacle_layouts_randomized: true
  initial_pose_templates_min: 4
  initial_pose_records_xy: true
  task_language_templates_min: 24
  task_language_bilingual: true
  task_text_encoding: utf8_byte_v1
  occluded_search_layouts_required: true
  occluded_search_layout_families: 4
  occluded_search_min_obstacle_count: 3
  occluded_search_min_clearance_m: 0.10
  occluded_search_start_curriculum: balanced_anchor_and_varied
  occluded_search_records_target_discovery_step: true
  occluded_search_records_min_obstacle_clearance: true
  episode_artifacts:
    - h264_video
    - episode_json
    - aggregate_json

acceptance:
  offline_loss_is_success: false
  target_visible_input_check_required: true
  random_layout_closed_loop_required: true
  obstacle_avoidance_closed_loop_required: true
  occluded_target_recovery_required: true
  occluded_search_learner_gate_required: true
  variable_start_pose_required: true
  sim2sim_requires_mujoco_gate: true
